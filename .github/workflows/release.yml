name: Release

# 打 tag（如 v1.0.0）或手动运行即触发：分别构建 arm64/x86_64 单架构包
# -> 组装 .app -> strip -> 签名 -> 公证 -> 装订 -> 生成 update manifest
# -> 发布 GitHub Release。
#
# 需要在仓库 Settings -> Secrets and variables -> Actions 配置以下 secrets：
#   MACOS_CERTIFICATE_P12        Developer ID Application 证书（.p12 文件 base64 编码）
#   MACOS_CERTIFICATE_PASSWORD   上述 .p12 的导出密码
#   MACOS_SIGNING_IDENTITY       签名身份，如 "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_API_KEY_ID            App Store Connect API Key ID
#   NOTARY_API_ISSUER_ID         App Store Connect API Issuer ID
#   NOTARY_API_KEY_P8            App Store Connect API 私钥（.p8 文件 base64 编码）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v (e.g. 1.0.0)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: RelayDog
  BUNDLE_ID: com.jackyzhang.relaydog
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

  release:
    name: Release ${{ matrix.arch }}
    needs: test
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            artifact_suffix: macos-arm64
            update_manifest: update-arm64.json
          - arch: x86_64
            artifact_suffix: macos-x86_64
            update_manifest: update-x86_64.json
    steps:
      - uses: actions/checkout@v4

      - name: Derive release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "${version}" ]; then
            echo "Release version must not be empty." >&2
            exit 1
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.arch }} binary
        run: swift build --scratch-path .build/${{ matrix.arch }} -c release --arch ${{ matrix.arch }} --product RelayDogMenuBar

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          BUILD_DIR=".build/${{ matrix.arch }}/${{ matrix.arch }}-apple-macosx/release"
          APP="dist/${APP_NAME}.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          cp "${BUILD_DIR}/RelayDogMenuBar" "${APP}/Contents/MacOS/${APP_NAME}"
          strip -S -x "${APP}/Contents/MacOS/${APP_NAME}"
          # SwiftPM 资源包（logo 等），Bundle.module 会在主 bundle 的 Resources 下查找
          find "${BUILD_DIR}" -maxdepth 1 -name "*.bundle" -exec cp -R {} "${APP}/Contents/Resources/" \;

          # 由 PNG 生成 icns。直接写 ICNS 容器，避免 iconutil 对 iconset 校验不稳定。
          ICON_WORKDIR="dist/AppIconPngs"
          mkdir -p "${ICON_WORKDIR}"
          SRC="Sources/RelayDogApp/Resources/relaydog-logo.png"
          for item in icp4:16 icp5:32 icp6:64 ic07:128 ic08:256 ic09:512 ic10:1024; do
            icon_type="${item%%:*}"
            icon_size="${item##*:}"
            sips -z "${icon_size}" "${icon_size}" "${SRC}" --out "${ICON_WORKDIR}/${icon_type}.png" >/dev/null
          done
          APP_ICON_OUTPUT="${APP}/Contents/Resources/AppIcon.icns" ICON_WORKDIR="${ICON_WORKDIR}" python3 - <<'PY'
          from pathlib import Path
          import os
          import struct

          icon_dir = Path(os.environ["ICON_WORKDIR"])
          output = Path(os.environ["APP_ICON_OUTPUT"])
          chunks = []
          for icon_type in ["icp4", "icp5", "icp6", "ic07", "ic08", "ic09", "ic10"]:
              data = (icon_dir / f"{icon_type}.png").read_bytes()
              chunks.append(icon_type.encode("ascii") + struct.pack(">I", len(data) + 8) + data)
          body = b"".join(chunks)
          output.write_bytes(b"icns" + struct.pack(">I", len(body) + 8) + body)
          PY

          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHumanReadableCopyright</key><string>© $(date +%Y) RelayDog</string>
          </dict>
          </plist>
          PLIST

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          rm "${RUNNER_TEMP}/certificate.p12"

      - name: Codesign
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          codesign --force --deep --options runtime --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      - name: Notarize
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          KEY_PATH="${RUNNER_TEMP}/notary_key.p8"
          echo "${NOTARY_API_KEY_P8}" | base64 --decode > "${KEY_PATH}"

          ditto -c -k --keepParent "${APP}" "dist/${APP_NAME}-notarize.zip"
          xcrun notarytool submit "dist/${APP_NAME}-notarize.zip" \
            --key "${KEY_PATH}" \
            --key-id "${NOTARY_API_KEY_ID}" \
            --issuer "${NOTARY_API_ISSUER_ID}" \
            --wait
          rm "${KEY_PATH}" "dist/${APP_NAME}-notarize.zip"

          xcrun stapler staple "${APP}"
          spctl --assess --type execute --verbose=2 "${APP}"

      - name: Package release artifacts
        run: |
          set -euo pipefail
          ARTIFACT_NAME="${APP_NAME}-${VERSION}-${{ matrix.artifact_suffix }}.zip"
          UPDATE_MANIFEST="${{ matrix.update_manifest }}"
          ditto -c -k --keepParent "dist/${APP_NAME}.app" "dist/${ARTIFACT_NAME}"

          cat > "dist/${UPDATE_MANIFEST}" <<JSON
          {
            "version": "${VERSION}",
            "downloadURL": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ARTIFACT_NAME}",
            "releaseNotes": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          }
          JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.artifact_suffix }}.zip
            dist/${{ matrix.update_manifest }}
          generate_release_notes: true
